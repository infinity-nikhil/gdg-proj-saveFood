services:
  postgres:
    image: postgres:17-alpine
    container_name: morsel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: morsel
      POSTGRES_PASSWORD: morsel
      POSTGRES_DB: morsel
    ports:
      - "5432:5432"
    volumes:
      - morsel-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U morsel"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  morsel-data:
